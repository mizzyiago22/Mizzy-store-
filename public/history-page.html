function PRICE(n) { return window.KLSMoney ? window.KLSMoney.price(n) : '₦' + Number(n || 0).toLocaleString('en-NG'); }
function AMT(n)   { return window.KLSMoney ? window.KLSMoney.amount(n) : '₦' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    (function(){
      try {
        var pref = localStorage.getItem('ksl_theme');
        var effective = (pref === 'light' || pref === 'dark') ? pref : (function(){ var h = new Date().getHours(); return (h >= 19 || h < 7) ? 'dark' : 'light'; })();
        document.documentElement.setAttribute('data-theme', effective);
        // Follow the device / country clock: with no manual override, re-evaluate the
        // theme on a timer and whenever the tab is shown again (covers timezone changes).
        var auto = function(){
          try {
            var p = localStorage.getItem('ksl_theme');
            if (p === 'light' || p === 'dark') return;
            var h = new Date().getHours();
            document.documentElement.setAttribute('data-theme', (h >= 19 || h < 7) ? 'dark' : 'light');
          } catch(e) {}
        };
        setInterval(auto, 10 * 60 * 1000);
        document.addEventListener('visibilitychange', function(){ if (!document.hidden) auto(); });
      } catch(e) {}
    })();
    (function(){
      try {
        if (!localStorage.getItem('ksl_token')) {
          document.write('<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#888">Redirecting to login…</div>');
          window.location.replace('/login');
        }
      } catch(e) {}
    })();
  </script>

    <symbol id="i-flag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18"/><path d="M5 4h13l-3 4 3 4H5"/></g></symbol>
    <symbol id="i-at-sign" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 005 0V12a9 9 0 10-4 7.5"/></g></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></g></symbol>

<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="/dashboard" class="nav-brand" style="text-decoration:none">
      <div class="brand-icon"><svg class="icon i-crown" aria-hidden="true"><use href="#i-crown"/></svg></div>
      <div class="brand-words"><span class="brand-ksl">Mizzy Sales</span><span class="brand-full">Purchase History</span></div>
    </a>
    <a href="/dashboard" class="btn-primary" style="padding:8px 16px;font-size:13.5px;text-decoration:none"><svg class="icon i-arrow-left" aria-hidden="true"><use href="#i-arrow-left"/></svg> Back</a>
  </div>
</nav>
<main class="page active" style="max-width:720px;margin:0 auto;padding:24px 16px 130px">
  <div class="page-hero" style="padding:0 0 18px">
    <h1 id="hTitle" style="margin:0 0 6px">History</h1>
    <p id="hSub" style="color:var(--t2);margin:0;font-size:14px"></p>
  </div>
  <div id="hList" style="display:flex;flex-direction:column;gap:12px;color:var(--t2);font-size:14px">Loading…</div>
</main>
<style>
  .hx-card{background:var(--card,#16161f);border:1px solid var(--border,#2a2a40);border-radius:14px;padding:14px 16px}
  .hx-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .hx-title{font-weight:700;color:var(--t1,#fff);font-size:15px;word-break:break-word}
  .hx-meta{color:var(--t2,#9a9ab0);font-size:12.5px;margin-top:4px;line-height:1.6}
  .hx-price{font-weight:800;color:var(--t1,#fff);font-size:14px;white-space:nowrap}
  .hx-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .hx-b-code{background:rgba(34,197,94,.15);color:#22c55e}
  .hx-b-wait{background:rgba(59,130,246,.15);color:#3b82f6}
  .hx-b-cancel{background:rgba(239,68,68,.15);color:#ef4444}
  .hx-b-exp{background:rgba(148,163,184,.18);color:#94a3b8}
  .hx-code{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2,#1d1d2a);border:1px dashed var(--border,#2a2a40);border-radius:10px;padding:10px 12px}
  .hx-code b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;letter-spacing:2px;color:var(--t1,#fff)}
  .hx-btn{background:var(--nb-blue,#2f7bf6);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-block}
  .hx-empty{text-align:center;padding:40px 10px;color:var(--t2,#9a9ab0)}
  .hx-details{margin-top:10px;background:var(--card2,#1d1d2a);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--t1,#fff);white-space:pre-wrap;word-break:break-word}
</style>
<script>
(function () {
  var KINDS = {
    'market-1': { market: true, title: 'Marketplace 1', back: '/marketplace' },
    'market-2': { market: true, title: 'Marketplace 2', back: '/marketplace2' },
    'market-3': { market: true, title: 'Marketplace 3', back: '/marketplace3' },
    'market-4': { market: true, title: 'Marketplace 4', back: '/marketplace4' },
    'number-1': { market: false, title: 'Buy Number 1', back: '/buy-number-app?server=server1' },
    'number-2': { market: false, title: 'Buy Number 2', back: '/buy-number-app?server=server2' }
  };
  var kind = (location.pathname.split('/').pop() || '');
  var cfg = KINDS[kind];
  var listEl = document.getElementById('hList');
  var titleEl = document.getElementById('hTitle');
  var subEl = document.getElementById('hSub');
  var token = null;
  try { token = localStorage.getItem('ksl_token'); } catch (e) {}

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtDate(d) { if (!d) return '—'; var x = new Date(d); return isNaN(x) ? '—' : x.toLocaleString(); }
  function naira(n) { return '₦' + (Number(n) || 0).toLocaleString(); }
  function copy(text, btn) {
    try { navigator.clipboard.writeText(text).then(function () { btn.textContent = 'Copied'; }); } catch (e) {}
  }
  function showEmpty(msg) { listEl.innerHTML = '<div class="hx-empty">' + esc(msg) + '</div>'; }

  if (!cfg) { titleEl.textContent = 'History'; showEmpty('This history page does not exist.'); return; }
  titleEl.textContent = cfg.title + ' — History';
  subEl.textContent = cfg.market ? 'Every purchase from this marketplace.' : 'Every number from this server, with its status and code.';
  var back = document.querySelector('.nav-inner a.btn-primary');
  if (back) { back.href = cfg.back; }
  if (!token) { showEmpty('Please sign in to see your history.'); return; }

  var endpoint = (cfg.market ? '/api/history/market/' : '/api/history/number/') + kind;
  fetch(endpoint, { headers: { Authorization: 'Bearer ' + token } })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
    .then(function (res) {
      if (!res.ok) { showEmpty((res.data && res.data.error) || 'Could not load history.'); return; }
      var rows = res.data || [];
      if (!rows.length) { showEmpty(cfg.market ? 'No purchases from this marketplace yet.' : 'No numbers bought from this server yet.'); return; }
      listEl.innerHTML = rows.map(cfg.market ? renderMarket : renderNumber).join('');
      listEl.querySelectorAll('[data-copy]').forEach(function (b) {
        b.addEventListener('click', function () { copy(b.getAttribute('data-copy'), b); });
      });
    })
    .catch(function () { showEmpty('Could not load history. Check your connection and refresh.'); });

  function renderMarket(p) {
    var meta = [];
    meta.push('Date: ' + esc(fmtDate(p.date)));
    if (p.orderId) meta.push('Order: ' + esc(p.orderId));
    if (p.providerOrderId) meta.push('Supplier order: ' + esc(p.providerOrderId));
    return '<div class="hx-card">' +
      '<div class="hx-top"><div><div class="hx-title">' + esc(p.title || 'Purchase') + '</div>' +
      '<div class="hx-meta">' + meta.join(' · ') + '</div></div>' +
      '<div class="hx-price">' + naira(p.price) + '</div></div>' +
      (p.details ? '<div class="hx-details">' + esc(p.details) + '</div>' : '') +
      (p.details ? '<div style="margin-top:8px"><button type="button" class="hx-btn" data-copy="' + esc(p.details) + '">Copy details</button></div>' : '') +
      (p.link ? '<div style="margin-top:8px"><a class="hx-btn" href="' + esc(p.link) + '" target="_blank" rel="noopener">Open link</a></div>' : '') +
      '</div>';
  }

  function renderNumber(n) {
    var badge = { code: ['hx-b-code', 'Code received'], waiting: ['hx-b-wait', 'Waiting for code'], cancelled: ['hx-b-cancel', 'Cancelled'], expired: ['hx-b-exp', 'Expired'] }[n.status] || ['hx-b-exp', 'Unknown'];
    var meta = ['Bought: ' + esc(fmtDate(n.date))];
    if (n.country) meta.push(esc(n.country));
    if (n.status === 'code' && n.codeAt) meta.push('Code at: ' + esc(fmtDate(n.codeAt)));
    if (n.status === 'cancelled' && n.cancelledAt) meta.push('Cancelled: ' + esc(fmtDate(n.cancelledAt)));
    if (n.status === 'expired' && n.expiredAt) meta.push('Expired: ' + esc(fmtDate(n.expiredAt)));
    return '<div class="hx-card">' +
      '<div class="hx-top"><div><div class="hx-title">' + esc(n.service || 'Number') + ' — ' + esc(n.phoneNumber || '') + '</div>' +
      '<div class="hx-meta">' + meta.join(' · ') + '</div></div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="hx-badge ' + badge[0] + '">' + badge[1] + '</span>' +
      '<div class="hx-price">' + naira(n.price) + '</div></div></div>' +
      (n.code ? '<div class="hx-code"><b>' + esc(n.code) + '</b><button type="button" class="hx-btn" data-copy="' + esc(n.code) + '">Copy code</button></div>' : '') +
      '</div>';
  }
})();
</script>

<script src="/js/site-header.js?v=5" defer></script>
<script src="/js/mz-banner.js?v=2"></script>
</body>
</html>
